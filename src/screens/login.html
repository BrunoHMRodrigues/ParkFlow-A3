<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../css/global.css">
        <link rel="stylesheet" href="../css/login.css">
        <script src="../js/login.js"></script>
        <title>ParkFlow - Login Institucional</title>
    </head>

    <body>
        <main class="app-container login-screen">

            <!-- Header fixado no topo -->
            <header class="login-header">
                <div class="brand-header">
                    <img src="../assets/ParkFlow Sub Logo.png" alt="ParkFlow Logo" class="brand-logo" />
                    <h1 class="brand-title">Park<span class="brand-flow">Flow</span></h1>
                </div>
            </header>

            <!-- Miolo centralizado verticalmente -->
            <section class="login-content">
                <h2 class="login-title">Bem-vindo de volta</h2>
                <p class="login-subtitle">Acesse com suas credenciais institucionais para gerenciar sua vaga.</p>

                <!-- Formulário com suporte a tecla Enter -->
                <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                    <!-- Input RA -->
                    <div class="input-group">
                        <label for="ra" class="input-label">RA / Matrícula Institucional</label>
                        <div class="input-wrapper" id="raWrapper">
                            <span class="input-icon-left">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <input type="text" id="ra" class="input-field" placeholder="Digite seu RA ou Matrícula">
                        </div>
                    </div>

                    <!-- Input Senha -->
                    <div class="input-group">
                        <label for="senha" class="input-label">Senha</label>
                        <div class="input-wrapper" id="senhaWrapper">
                            <span class="input-icon-left">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input type="password" id="senha" class="input-field" placeholder="••••••••">
                            <button type="button" class="input-icon-right" onclick="togglePasswordVisibility()" title="Exibir/Ocultar Senha">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Mensagem de Erro de Validação -->
                    <div id="loginErrorMessage" class="login-error-box hidden" role="alert"></div>

                    <!-- Link Esqueceu Senha -->
                    <div class="forgot-password-wrap">
                        <button type="button" class="btn-link" onclick="window.location.href='forgot-password.html'">
                            Esqueceu sua senha?
                        </button>
                    </div>

                    <!-- Botão Acessar -->
                    <button type="submit" class="btn-primary">
                        Acessar Sistema
                    </button>
                </form>
            </section>

            <!-- Footer na base da tela -->
            <footer class="login-footer">
                <div class="info-card">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6C82A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <span class="info-card-text">
                        Acesso exclusivo para alunos e servidores com matrícula ativa.
                    </span>
                </div>
            </footer>
        </main>

        <script src="../js/login.js"></script>
    </body>
</html>
